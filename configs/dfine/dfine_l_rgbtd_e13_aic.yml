__include__:
  - ./dfine_l_rgbt_wavelet_p2_aic.yml

task: detection
num_classes: 12
remap_mscoco_category: False
eval_spatial_size: [864, 1536]
output_dir: runs/e13_dfine_l_rgbtd_balanced
sync_bn: False
use_amp: False
accumulation_steps: 8
tuning_insert_p2: False
safe_stage_transition: True

HGNetv2:
  name: B4
  return_idx: [0, 1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
  input_mode: rgbtd
  adapter_hidden: 32
  fusion_mode: wavelet_pyramid_depth
  auxiliary_width: 48
  fusion_hidden: 64
  auxiliary_dropout: 0.10
  depth_width: 32
  depth_hidden: 48
  depth_dropout: 0.15

train_dataloader:
  type: DataLoader
  dataset:
    type: AICZipMultimodalDetection
    img_folder: data
    ann_file: data/prepared/dfine_e13/train_balanced.json
    input_mode: rgbtd
    return_masks: False
    transforms:
      type: Compose
      ops:
        - type: MultimodalTailCopyPaste
          tail_classes: [1, 7, 10, 11]
          p: 0.45
          max_paste: 2
          scale_min: 0.8
          scale_max: 1.2
          position_jitter: 0.08
          max_iou: 0.20
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.65}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [864, 1536]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: SanitizeMultimodalDepth, threshold: 0.5}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: 55
        ops: [MultimodalTailCopyPaste, RandomZoomOut, RandomIoUCrop]
  shuffle: True
  num_workers: 6
  drop_last: True
  total_batch_size: 2
  collate_fn:
    type: BatchImageCollateFunction
    base_size: [864, 1536]
    base_size_repeat: null
    stop_epoch: 55
    ema_restart_decay: 0.9999

val_dataloader:
  type: DataLoader
  dataset:
    type: AICZipMultimodalDetection
    img_folder: data
    ann_file: data/prepared/dfine_e13/val.json
    input_mode: rgbtd
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [864, 1536]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: SanitizeMultimodalDepth, threshold: 0.5}
  shuffle: False
  num_workers: 6
  drop_last: False
  total_batch_size: 2
  collate_fn:
    type: BatchImageCollateFunction

optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*backbone)(?=.*(?:depth_pyramid|depth_feature_fusions)).*$', lr: 0.000125}
    - {params: '^(?=.*backbone)(?=.*input_adapter).*$', lr: 0.0000625}
    - {params: '^(?=.*backbone)(?=.*(?:auxiliary_pyramid|feature_fusions))(?!.*(?:depth_pyramid|depth_feature_fusions)).*$', lr: 0.000025}
    - {params: '^(?=.*backbone)(?!.*(?:input_adapter|auxiliary_pyramid|feature_fusions|depth_pyramid|depth_feature_fusions|norm|bn)).*$', lr: 0.000003125}
    - {params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$', weight_decay: 0.0}
  lr: 0.0000625
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 90
clip_max_norm: 0.1
lr_scheduler:
  type: MultiStepLR
  milestones: [70, 84]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 200
