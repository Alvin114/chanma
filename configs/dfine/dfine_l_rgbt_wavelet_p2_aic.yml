__include__:
  - ./dfine_l_rgbt_aic.yml

task: detection
num_classes: 12
remap_mscoco_category: False
eval_spatial_size: [864, 1536]
output_dir: runs/e12_dfine_l_rgbt_wavelet_p2
sync_bn: False
use_amp: False
accumulation_steps: 5
tuning_insert_p2: True

HGNetv2:
  name: B4
  return_idx: [0, 1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
  input_mode: rgbt
  adapter_hidden: 32
  fusion_mode: wavelet_pyramid
  auxiliary_width: 48
  fusion_hidden: 64
  auxiliary_dropout: 0.10

HybridEncoder:
  in_channels: [128, 512, 1024, 2048]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 1
  act: silu

DFINETransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_levels: 4
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 3, 3, 3]
  cross_attn_method: default
  query_select_method: default

DFINEPostProcessor:
  num_top_queries: 100

train_dataloader:
  type: DataLoader
  dataset:
    type: AICZipMultimodalDetection
    img_folder: data
    ann_file: data/prepared/dfine_e12/train_balanced.json
    input_mode: rgbt
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [864, 1536]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: 66
        ops: [RandomZoomOut, RandomIoUCrop]
  shuffle: True
  num_workers: 6
  drop_last: True
  total_batch_size: 3
  collate_fn:
    type: BatchImageCollateFunction
    base_size: [864, 1536]
    base_size_repeat: null
    stop_epoch: 66
    ema_restart_decay: 0.9999

val_dataloader:
  type: DataLoader
  dataset:
    type: AICZipMultimodalDetection
    img_folder: data
    ann_file: data/prepared/dfine_e12/val.json
    input_mode: rgbt
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [864, 1536]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
  shuffle: False
  num_workers: 6
  drop_last: False
  total_batch_size: 3
  collate_fn:
    type: BatchImageCollateFunction

optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*backbone)(?=.*(?:input_adapter|auxiliary_pyramid|feature_fusions)).*$', lr: 0.00025}
    - {params: '^(?=.*backbone)(?!.*(?:input_adapter|auxiliary_pyramid|feature_fusions|norm|bn)).*$', lr: 0.00000625}
    - {params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$', weight_decay: 0.0}
  lr: 0.000125
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 110
clip_max_norm: 0.1
lr_scheduler:
  type: MultiStepLR
  milestones: [88, 103]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 300
